button.clear-btn{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:1px;color:#8b8d98;background:transparent;border:1px solid rgba(255,255,255,0.14);border-radius:6px;padding:5px 10px;cursor:pointer}
button.clear-btn:hover{color:#e8e8ee;border-color:rgba(255,255,255,0.3)}
input.name-input{font-family:ui-monospace,monospace;font-size:11px;color:#e8e8ee;background:#17181c;border:1px solid rgba(255,255,255,0.14);border-radius:6px;padding:5px 9px;width:160px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));grid-auto-rows:132px;gap:16px}
.card{background:#17181c;border:1px solid rgba(255,255,255,0.08);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;overflow:hidden;cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease;font:inherit;color:inherit;text-align:center}
.card:hover{border-color:rgba(255,255,255,0.2)}
.card[aria-pressed="true"]{border-color:#8b5cf6;box-shadow:0 0 0 2px rgba(139,92,246,0.35)}
.label{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:2px;color:#8b8d98;text-transform:uppercase;font-weight:600}

/* Font size sits on the outermost layer so every em below it scales with the text. */
.preview{font-family:'Minecraft',monospace;font-size:24px;line-height:1;color:#e8e8ee;-webkit-font-smoothing:none;font-smooth:never;text-rendering:geometricPrecision}
.title-row{font-size:clamp(32px,6vw,48px)}
.fx{display:inline-flex}
.letter-row{display:inline-flex;gap:0;align-items:baseline}
.letter-row > span{display:inline-block;backface-visibility:hidden}

<body>
<div class="wrap">
  <header>
    <div class="section-label">Nametag style preview</div>
    <div style="display:flex;margin:10px 0"><div id="title-mount"></div></div>
    <div class="bar">
      <span class="hint-text" id="hint"></span>
      <button class="clear-btn" id="clear">Clear all</button>
      <label class="hint-text">Name <input class="name-input" id="name" value="Voidlesh" maxlength="20"></label>
    </div>
  </header>
  <section><div class="group-head">Motion <span class="group-note">— stack as many as you like</span></div><div class="grid" id="g-motion"></div></section>
  <section><div class="group-head">Color <span class="group-note">— one at a time, text can only hold one colour</span></div><div class="grid" id="g-color"></div></section>
  <section><div class="group-head">Overlay <span class="group-note">— layers on top of anything above</span></div><div class="grid" id="g-overlay"></div></section>
</div>

<script>
// Reference implementation of the effect model described in SPEC.md.
// Each effect animates exactly one property on its own layer, which is why any
// combination composes instead of overwriting.
var LAYERS = [
  { id:'shake',     anim:'mc-shake 0.55s linear infinite',                       will:'transform' },
  { id:'flip',      anim:'mc-flip 2.4s cubic-bezier(.62,0,.38,1) infinite',      will:'transform' },
  { id:'skew',      anim:'mc-skew 1.6s linear infinite',                         will:'transform' },
  { id:'grow',      anim:'mc-grow 1.4s linear infinite',                         will:'transform' },
  { id:'fade',      anim:'mc-fade 1.9s linear infinite',                         will:'opacity'   },
  { id:'glow',      anim:'mc-glow 2.2s linear infinite',                         will:'filter'    },
  { id:'chromatic', anim:'mc-chroma 1.6s linear infinite',                       will:'filter'    }
];
var LETTER_FX = [
  { id:'wave',    name:'mc-wave',    dur:'1.8s', step:0.13, will:'transform' },
  { id:'iterate', name:'mc-iter',    dur:'1.6s', step:0.10, will:''          },
  { id:'shimmer', name:'mc-shimmer', dur:'2.6s', step:0.07, will:'filter'    }
];
var COLORS = [
  { id:'gradient', label:'Gradient', name:'mc-col-gradient', dur:'3.2s', step:0.15 },
  { id:'rainbow',  label:'Rainbow',  name:'mc-col-rainbow',  dur:'3s',   step:0.18 },
  { id:'metallic', label:'Metallic', name:'mc-col-metallic', dur:'2.6s', step:0.13 },
  { id:'fire',     label:'Fire',     name:'mc-col-fire',     dur:'1.4s', step:0.09 }
];
var COLOR_IDS = COLORS.map(function(c){ return c.id; });
var LABELS = { shake:'Shaking', wave:'Waving', iterate:'Iterating', flip:'Flipping', skew:'Skewing',
  grow:'Growing', fade:'Fade', shimmer:'Shimmer', chromatic:'Chromatic', outline:'Outline', glow:'Glowing' };
COLORS.forEach(function(c){ LABELS[c.id] = c.label; });

var GROUPS = {
  motion:  ['shake','wave','iterate','flip','skew','grow'],
  color:   COLOR_IDS,
  overlay: ['fade','shimmer','chromatic','outline','glow']
};

var name = 'Voidlesh';
var sel = {};
Object.keys(LABELS).forEach(function(k){ sel[k] = false; });

// letter i is advanced by (n-1-i)*step, so the effect travels left to right
function delayOf(i, n, step){ return '-' + ((n - 1 - i) * step).toFixed(3) + 's'; }

function letterStyle(i, n, s){
  var anim = [], will = [];
  LETTER_FX.forEach(function(f){
    if (!s[f.id]) return;
    anim.push(f.name + ' ' + f.dur + ' linear ' + delayOf(i, n, f.step) + ' infinite');
    if (f.will) will.push(f.will);
  });
  var col = COLORS.filter(function(c){ return s[c.id]; })[0];
  if (col) anim.push(col.name + ' ' + col.dur + ' linear ' + delayOf(i, n, col.step) + ' infinite');
  if (!anim.length) return '';
  return 'animation:' + anim.join(', ') + (will.length ? ';will-change:' + will.join(',') : '');
}

function rowStyle(s){
  var parts = [];
  if (s.outline) parts.push('-webkit-text-stroke:0.055em #e8e8ee');
  // a colour style animates each letter and outranks these
  if (s.outline) parts.push('color:transparent');
  else if (s.glow) parts.push('color:#ffffff');
  return parts.join(';');
}

function build(s, extraClass){
  var outer = document.createElement('div');
  outer.className = 'preview fx' + (extraClass ? ' ' + extraClass : '');
  var host = outer;
  LAYERS.forEach(function(l, idx){
    var node = idx === 0 ? outer : document.createElement('div');
    if (idx !== 0){ node.className = 'fx'; host.appendChild(node); host = node; }
    node.style.cssText = s[l.id] ? 'animation:' + l.anim + ';will-change:' + l.will : '';
  });
  var row = document.createElement('div');
  row.className = 'letter-row';
  row.style.cssText = rowStyle(s);
  var chars = name.split('');
  chars.forEach(function(ch, i){
    var span = document.createElement('span');
    span.textContent = ch;
    span.style.cssText = letterStyle(i, chars.length, s);
    row.appendChild(span);
  });
  host.appendChild(row);
  return outer;
}

function toggle(id){
  var on = !sel[id];
  sel[id] = on;
  if (on && COLOR_IDS.indexOf(id) !== -1)
    COLOR_IDS.forEach(function(k){ if (k !== id) sel[k] = false; });
  render();
}

function render(){
  var mount = document.getElementById('title-mount');
  mount.textContent = '';
  mount.appendChild(build(sel, 'title-row'));

  Object.keys(GROUPS).forEach(function(g){
    var host = document.getElementById('g-' + g);
    host.textContent = '';
    GROUPS[g].forEach(function(id){
      var only = {}; only[id] = true;
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'card';
      card.setAttribute('aria-pressed', sel[id] ? 'true' : 'false');
      card.appendChild(build(only));
      var lab = document.createElement('div');
      lab.className = 'label';
      lab.textContent = LABELS[id];
      card.appendChild(lab);
      card.addEventListener('click', function(){ toggle(id); });
      host.appendChild(card);
    });
  });

  var n = Object.keys(sel).filter(function(k){ return sel[k]; }).length;
  document.getElementById('hint').textContent =
    n === 0 ? 'Click any style to combine them live' : n + (n === 1 ? ' style active' : ' styles active');
}

document.getElementById('clear').addEventListener('click', function(){
  Object.keys(sel).forEach(function(k){ sel[k] = false; });
  render();
});
document.getElementById('name').addEventListener('input', function(e){
  name = e.target.value || 'Voidlesh';
  render();
});
render();
</script>
