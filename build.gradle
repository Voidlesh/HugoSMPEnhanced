// The mod is built for two Minecraft lines from one source tree (src/): 1.21.11 (versions/1.21.11, Loom with remapping,
// Java 21) and 26.x (versions/26.3, unobfuscated, Java 25). mergedJar puts both into the one jar that gets released.
plugins {
	id 'base'
	// Both Loom variants are declared here once so that the two version projects share one plugin class loader.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

evaluationDependsOn(':mc1_21_11')
evaluationDependsOn(':mc26_3')

def mergedJar = tasks.register('mergedJar', hse.MergeJarTask) {
	group = 'build'
	description = 'The release jar: the 1.21.11 and the 26.x build of the mod in one jar.'
	dependsOn ':mc1_21_11:remapJar', ':mc26_3:jar'
	legacyJar = project(':mc1_21_11').tasks.named('remapJar').flatMap { it.archiveFile }
	modernJar = project(':mc26_3').tasks.named('jar').flatMap { it.archiveFile }
	output = layout.buildDirectory.file("libs/hugosmpenhanced-${project.version}.jar")
}

tasks.named('assemble') {
	dependsOn mergedJar
}

tasks.named('build') {
	dependsOn ':mc1_21_11:build', ':mc26_3:build'
}
