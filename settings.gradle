pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Should match your modid
rootProject.name = 'hugosmpenhanced'

// One project per Minecraft line, both built from the shared sources in src/. See docs/MULTIVERSION.md.
include 'mc1_21_11', 'mc26_1', 'mc26_2', 'mc26_3'
project(':mc1_21_11').projectDir = file('versions/1.21.11')
project(':mc26_3').projectDir = file('versions/26.3')
project(':mc26_1').projectDir = file('versions/26.1')
project(':mc26_2').projectDir = file('versions/26.2')
